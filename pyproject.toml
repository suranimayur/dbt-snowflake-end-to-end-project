[project]
name = "dbt-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suranimayur", email = "surani.mayur@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-databricks>=1.13.0",
    "dbt-snowflake>=1.12.4",
    "dbt-spark>=1.10.3",
    "ipykernel>=7.4.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
dbt-training = "dbt_training:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
