name: dbt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt:
    name: dbt build
    runs-on: ubuntu-latest
    environment: DBT_BTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dbt
        run: pip install dbt-core==1.12.6 dbt-snowflake==1.12.5

      - name: Check secrets
        env:
          DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
          DBT_PRIVATE_KEY: ${{ secrets.DBT_PRIVATE_KEY }}
        run: |
          test -n "$DBT_PROFILES_YML" || { echo "::error::Secret DBT_PROFILES_YML is missing"; exit 1; }
          test -n "$DBT_PRIVATE_KEY"  || { echo "::error::Secret DBT_PRIVATE_KEY is missing"; exit 1; }

      - name: Write dbt profile
        env:
          DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
        run: |
          mkdir -p ~/.dbt
          printf '%s\n' "$DBT_PROFILES_YML" > ~/.dbt/profiles.yml

      - name: Write Snowflake private key
        env:
          DBT_PRIVATE_KEY: ${{ secrets.DBT_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$DBT_PRIVATE_KEY" > ~/.dbt/rsa_key
          chmod 600 ~/.dbt/rsa_key

      - name: dbt deps
        run: dbt deps --project-dir BTC

      - name: dbt debug
        run: dbt debug --project-dir BTC

      - name: dbt run
        run: dbt run --project-dir BTC
