name: dbt CI

on:
  # Runs when a PR is opened/updated against main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  # Runs after the PR is merged (merge commit / squash lands on main)
  push:
    branches:
      - main
  # Lets you trigger a run manually from the Actions tab to verify the setup
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: dbt-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-run:
    runs-on: ubuntu-latest
    environment: DBT_BTC

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.12.6" "dbt-snowflake==1.12.5"

      - name: Set up dbt profile and private key
        env:
          DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
          DBT_PRIVATE_KEY: ${{ secrets.DBT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.dbt
          printf '%s\n' "$DBT_PROFILES_YML" > ~/.dbt/profiles.yml
          printf '%s\n' "$DBT_PRIVATE_KEY" > ~/.dbt/rsa_key
          chmod 600 ~/.dbt/rsa_key

      - name: Install dbt deps
        run: dbt deps --project-dir BTC

      - name: Run dbt debug
        run: dbt debug --project-dir BTC

      - name: Run dbt
        run: dbt run --project-dir BTC
